name: Verify official ISIR event catalog XLS columns (read-only)

on:
  pull_request:
    types: [synchronize]
    paths:
      - 'pilot/metadata_catalog_probe.py'
      - '.github/workflows/isir-metadata-catalog-probe.yml'

permissions:
  contents: read

jobs:
  inspect_official_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLS reader
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Inspect official public catalog XLS only (no SOAP requests)
        run: python -m pilot.metadata_catalog_probe
