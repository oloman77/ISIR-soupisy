name: Initialize ISIR Radar database and check candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-initialize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isir-radar-database-bootstrap
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Initialize isolated EU Radar D1 schema and inspect candidate counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m radar.initialize
