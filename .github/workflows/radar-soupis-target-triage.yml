name: ISIR soupis target-district metadata triage

on:
  pull_request:
    paths:
      - 'pilot/soupis_documents.py'
      - 'pilot/soupis_target_triage.py'
      - 'pilot/test_soupis_documents.py'
      - 'pilot/test_soupis_target_triage.py'
      - '.github/workflows/radar-soupis-target-triage.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-soupis-target-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify cadastral evidence and strict target selection
        run: python -m unittest -v pilot.test_soupis_documents pilot.test_soupis_target_triage

  triage:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Scan historical metadata only for target region and cadastre
        run: python -m pilot.soupis_target_triage
