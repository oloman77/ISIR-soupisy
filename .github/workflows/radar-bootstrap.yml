name: ISIR Radar – initialize D1 and import candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isir-radar-bootstrap
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate isolated Radar DB and import property candidates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_RADAR_D1_DATABASE_ID }}
        run: python -m radar.import_legacy
