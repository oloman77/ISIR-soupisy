name: ISIR crawler + Pages

on:
  push:
    branches: [main]
    paths:
      - 'crawler.py'
      - 'regions.py'
      - 'build_briefing.py'
      - '.github/workflows/isir.yml'
      - 'docs/index.html'
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "isir-pages"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Czech OCR
        run: sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y poppler-utils tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng

      - name: Install dependencies
        run: pip install requests pypdf fonttools

      - name: ISIR fast backfill / PDF phase
        env:
          DAYS_BACK: "90"
          MAX_BATCHES: "250"
          MAX_PDF_PER_RUN: "500"
          PAUSE: "0.05"
          SOAP_TIMEOUT: "45"
          PDF_TIMEOUT: "25"
        run: python crawler.py

      - name: Build lightweight briefing feed
        run: python build_briefing.py

      - name: Compact published results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/results.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          removed = 0
          for row in data.get('items', []):
              # Once a PDF has been successfully analysed, the raw ISIR note is
              # no longer needed by the crawler or the public table. Keeping it
              # for tens of thousands of rows pushed results.json over GitHub's
              # hard 100 MB per-file limit.
              if row.get('pdf_checked') and row.get('dokument_url') and 'poznamka' in row:
                  row.pop('poznamka', None)
                  removed += 1
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          size_mb = path.stat().st_size / 1024 / 1024
          print(f'Compacted results.json: removed raw notes from {removed} analysed rows; size={size_mb:.2f} MB')
          if size_mb >= 99:
              raise SystemExit(f'results.json is still too large ({size_mb:.2f} MB)')
          PY

      - name: Commit state and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/results.json docs/briefing.json
          git diff --cached --quiet || git commit -m "Update ISIR fast backfill"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
