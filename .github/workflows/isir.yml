name: ISIR crawler + Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "isir-pages"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Czech OCR
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng

      - name: Install dependencies
        run: pip install requests pypdf fonttools

      - name: ISIR fast backfill / PDF phase
        env:
          DAYS_BACK: "180"
          MAX_BATCHES: "250"
          MAX_PDF_PER_RUN: "150"
          PAUSE: "0.05"
          SOAP_TIMEOUT: "45"
          PDF_TIMEOUT: "25"
        run: python crawler.py

      - name: Commit state and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/results.json
          git diff --cached --quiet || git commit -m "Update ISIR fast backfill"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

