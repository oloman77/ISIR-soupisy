name: ISIR crawler + Pages

on:
  push:
    branches: [main]
    paths:
      - 'crawler.py'
      - 'regions.py'
      - 'build_briefing.py'
      - '.github/workflows/isir.yml'
      - 'docs/index.html'
  workflow_dispatch:
    inputs:
      max_batches:
        description: "Limited manual ISIR batches (1–5)"
        required: true
        type: number
        default: 1
      max_pdf_per_run:
        description: "Limited manual PDF analyses (0–5)"
        required: true
        type: number
        default: 2
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "isir-pages"
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    # Schedules stay off until explicitly enabled by repository variable.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ISIR_SCHEDULE_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Czech OCR
        run: sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update && sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y poppler-utils tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng

      - name: Install dependencies
        run: pip install requests pypdf fonttools

      - name: ISIR fast backfill / PDF phase
        env:
          DAYS_BACK: "90"
          MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_batches || '250' }}
          MAX_PDF_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_pdf_per_run || '500' }}
          PAUSE: "0.05"
          SOAP_TIMEOUT: "45"
          PDF_TIMEOUT: "25"
          ISIR_STORE: "d1"
          ISIR_D1_REQUIRED_NAME: "isir-prod"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_PROD_DATABASE_ID }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$MAX_BATCHES" =~ ^[1-5]$ ]] || { echo "Invalid manual batch limit"; exit 1; }
            [[ "$MAX_PDF_PER_RUN" =~ ^[0-5]$ ]] || { echo "Invalid manual PDF limit"; exit 1; }
          fi
          python crawler.py

      - name: Build lightweight briefing feed
        run: python build_briefing.py

      - name: Validate compact Pages payload
        run: |
          python - <<'PY'
          from pathlib import Path
          file = Path('docs/results.json')
          size = file.stat().st_size
          print(f'Published results.json size: {size} bytes')
          if size > 10_000_000:
              raise SystemExit('Pages JSON over 10 MB; D1 state is safe, publication stopped')
          PY

      - name: Commit published feeds only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results.json docs/briefing.json
          git diff --cached --quiet || git commit -m "Update ISIR fast backfill"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
