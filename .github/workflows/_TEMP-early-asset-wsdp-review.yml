name: One-time historical early assets and WSDP 3.1 documentation audit

on:
  pull_request:
    types: [opened]
    paths:
      - 'pilot/early_asset_case_study_20261024.py'
      - 'pilot/wsdp31_docs_readonly_20261024.py'
      - '.github/workflows/_TEMP-early-asset-wsdp-review.yml'

permissions:
  contents: read

jobs:
  one_time_read_only_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lightweight PDF parser and text extractor
        run: |
          python -m pip install --disable-pip-version-check pypdf==6.1.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Review 1 official WSDP 3.1 technical ZIP, documentation only
        run: python -m pilot.wsdp31_docs_readonly_20261024
      - name: Review at most 9 archived real ISIR early and soupis PDFs
        run: python -m pilot.early_asset_case_study_20261024
      - name: Retain metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-asset-experiment-20261024
          path: early-doc-experiment.json
          if-no-files-found: warn
          retention-days: 10
