name: Audit Radar password secret presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-password-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Cloudflare Pages secret metadata without reading values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          base = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID']
          req = urllib.request.Request(
              base + '/pages/projects/isir-radar',
              headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as resp:
              body=json.load(resp)
          if not body.get('success') or body['result'].get('name')!='isir-radar':
              raise SystemExit('Cannot safely confirm Radar project configuration')
          project=body['result']
          for environment in ('production','preview'):
              config=(project.get('deployment_configs') or {}).get(environment) or {}
              variables=config.get('env_vars') or {}
              value=variables.get('RADAR_LOGIN_PASSWORD')
              print(environment.upper(),'RADAR_LOGIN_PASSWORD present:',value is not None)
              if isinstance(value,dict):
                  print(environment.upper(),'variable type:',value.get('type','unknown'))
              bindings=config.get('d1_databases') or {}
              print(environment.upper(),'D1 DB binding present:','DB' in bindings)
          print('Audit completed: no passwords, values or credentials were printed.')
          PY
