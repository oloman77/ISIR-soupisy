name: Pilot locality recovery from historical ISIR cases

on:
  pull_request:
    paths:
      - 'pilot/**'
      - '.github/workflows/radar-pilot.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Safety and reproducibility tests (offline)
        run: python -m unittest -v pilot.test_case_trial

  run:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Analyze nationwide unresolved cases without downloading PDFs
        env:
          PILOT_SCAN_PDFS: '0'
        run: python -m pilot.case_trial
