name: Deploy private ISIR Radar to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'radar/**'
      - 'functions/**'
      - '.github/workflows/radar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isir-radar-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Radar schema and source code
        run: |
          python -m unittest -v test_radar radar.test_public_offers
          npm run check:radar
          npm run check:auth
          npm run check:detail
      - name: Create isolated Pages project and bind EU D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
        run: python radar/cloudflare_deploy_setup.py
      - name: Publish Radar with compiled Pages Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy radar/public --project-name=isir-radar --branch=main --commit-hash="${GITHUB_SHA}"
      - name: Verify private Radar endpoint requires password
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for path in ("/", "/api/properties", "/api/property?id=isir-doc%3A12"):
              last_status = None
              for attempt in range(12):
                  request = urllib.request.Request(
                      "https://isir-radar.pages.dev" + path,
                      headers={"User-Agent": "ISIR-Radar-Deploy-Check/1.0"})
                  try:
                      with urllib.request.urlopen(request, timeout=15) as response:
                          status = response.status
                          challenge = response.headers.get("WWW-Authenticate", "")
                  except urllib.error.HTTPError as error:
                      status = error.code
                      challenge = error.headers.get("WWW-Authenticate", "")
                  if status == 401 and challenge.startswith('Basic realm="ISIR Radar"'):
                      print("PASS: unauthenticated", path, "requires password (HTTP 401)")
                      break
                  last_status = status
                  time.sleep(4)
              else:
                  raise SystemExit(
                      "Radar security smoke test FAILED at " + path +
                      "; last HTTP status " + str(last_status) +
                      ". Expect 401 Basic challenge. Check Production RADAR_LOGIN_PASSWORD Secret.")
          PY
